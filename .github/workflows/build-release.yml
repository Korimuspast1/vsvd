name: Build VSVD release APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f0f7-vsvd

permissions:
  contents: read

jobs:
  build:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout VSVD and Telegram Android source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36 and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore private local build configuration
        env:
          TELEGRAM_PROPERTIES_B64: ${{ secrets.VSVD_TELEGRAM_PROPERTIES_B64 }}
          SIGNING_PROPERTIES_B64: ${{ secrets.VSVD_SIGNING_PROPERTIES_B64 }}
          KEYSTORE_B64: ${{ secrets.VSVD_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TELEGRAM_PROPERTIES_B64"
          test -n "$SIGNING_PROPERTIES_B64"
          test -n "$KEYSTORE_B64"
          printf '%s' "$TELEGRAM_PROPERTIES_B64" | base64 --decode > telegram.properties
          printf '%s' "$SIGNING_PROPERTIES_B64" | base64 --decode > vsvd-signing.properties
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/vsvd-release.p12
          chmod 600 telegram.properties vsvd-signing.properties signing/vsvd-release.p12

      - name: Build signed release APK
        run: |
          set -euo pipefail
          # GitHub hosted runners have less memory than the upstream default.
          sed -i 's/org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g/' upstream/telegram-android/gradle.properties
          ./scripts/build-release-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vsvd-release-apk
          path: upstream/telegram-android/TMessagesProj_App/build/outputs/apk/**/app.apk
          if-no-files-found: error
          retention-days: 14
